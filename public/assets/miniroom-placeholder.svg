<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180A2C"/>
      <stop offset="100%" stop-color="#0D0714"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241242"/>
      <stop offset="100%" stop-color="#150826"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A1F63"/>
      <stop offset="100%" stop-color="#2A1745"/>
    </linearGradient>
    <linearGradient id="deskSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C0F2E"/>
      <stop offset="100%" stop-color="#120819"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B14EFF"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B14EFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg)"/>

  <!-- back wall grid -->
  <g stroke="#3A1F63" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="440" y1="0" x2="440" y2="200"/>
    <line x1="520" y1="0" x2="520" y2="200"/>
  </g>

  <!-- isometric floor -->
  <polygon points="0,200 600,200 600,340 0,340" fill="url(#floor)"/>
  <g stroke="#3A1F63" stroke-width="1" opacity="0.5">
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="200" x2="0" y2="340"/>
    <line x1="200" y1="200" x2="160" y2="340"/>
    <line x1="340" y1="200" x2="340" y2="340"/>
    <line x1="480" y1="200" x2="520" y2="340"/>
  </g>

  <!-- ambient glow -->
  <circle cx="440" cy="90" r="120" fill="url(#glow)" filter="url(#soft)"/>

  <!-- window -->
  <rect x="410" y="30" width="140" height="90" rx="6" fill="#0D0714" stroke="#FFD60A" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="480" y1="30" x2="480" y2="120" stroke="#FFD60A" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="410" y1="75" x2="550" y2="75" stroke="#FFD60A" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="445" cy="60" r="22" fill="url(#screen)" opacity="0.6" filter="url(#soft)"/>

  <!-- desk -->
  <polygon points="70,230 340,230 300,270 30,270" fill="url(#deskTop)" stroke="#B14EFF" stroke-opacity="0.4"/>
  <polygon points="30,270 60,270 60,320 30,320" fill="url(#deskSide)"/>
  <polygon points="300,270 330,270 330,320 300,320" fill="url(#deskSide)"/>

  <!-- monitor -->
  <polygon points="130,175 230,175 245,225 115,225" fill="#1C0F2E" stroke="#B14EFF" stroke-opacity="0.6" stroke-width="2"/>
  <polygon points="142,182 218,182 228,218 132,218" fill="url(#screen)" opacity="0.85"/>
  <text x="180" y="205" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-weight="700" font-size="26" fill="#0D0714">N</text>
  <rect x="170" y="225" width="20" height="14" fill="#1C0F2E"/>

  <!-- desk lamp -->
  <line x1="290" y1="230" x2="290" y2="195" stroke="#5C3B8C" stroke-width="4" stroke-linecap="round"/>
  <line x1="290" y1="195" x2="265" y2="180" stroke="#5C3B8C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="262" cy="178" r="8" fill="#FFD60A"/>
  <circle cx="262" cy="178" r="16" fill="#FFD60A" opacity="0.3" filter="url(#soft)"/>

  <!-- plant -->
  <rect x="500" y="255" width="34" height="30" rx="4" fill="#3A1F63"/>
  <path d="M517 255 C505 235 505 215 517 200 C529 215 529 235 517 255 Z" fill="#5C3B8C"/>
  <path d="M517 255 C500 240 495 222 505 205 C518 218 522 238 517 255 Z" fill="#B14EFF" opacity="0.85"/>
  <path d="M517 255 C534 240 539 222 529 205 C516 218 512 238 517 255 Z" fill="#FFD60A" opacity="0.8"/>

  <!-- chair -->
  <rect x="95" y="255" width="14" height="55" rx="4" fill="#2A1745"/>
  <rect x="80" y="245" width="44" height="14" rx="4" fill="#3A1F63"/>

  <text x="300" y="325" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="4" fill="#9D89C9">MINI ROOM</text>

  <rect x="1" y="1" width="598" height="338" fill="none" stroke="#FFD60A" stroke-opacity="0.25" stroke-width="2"/>
</svg>
