<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A2160"/>
      <stop offset="100%" stop-color="#241242"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1850"/>
      <stop offset="100%" stop-color="#1C0F35"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150826"/>
      <stop offset="100%" stop-color="#0A0512"/>
    </linearGradient>
    <radialGradient id="apexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#B14EFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="600" height="300" fill="#0A0512"/>

  <!-- room shell: two walls + floor meeting at a single apex -->
  <polygon points="0,0 300,78 0,300" fill="url(#wallL)"/>
  <polygon points="600,0 300,78 600,300" fill="url(#wallR)"/>
  <polygon points="300,78 0,300 600,300" fill="url(#floor)"/>

  <!-- wall grid: rays converging toward the apex -->
  <g stroke="#B14EFF" stroke-opacity="0.22" stroke-width="1">
    <line x1="60" y1="0" x2="300" y2="78"/>
    <line x1="150" y1="0" x2="300" y2="78"/>
    <line x1="240" y1="0" x2="300" y2="78"/>
    <line x1="360" y1="0" x2="300" y2="78"/>
    <line x1="450" y1="0" x2="300" y2="78"/>
    <line x1="540" y1="0" x2="300" y2="78"/>
  </g>
  <g stroke="#B14EFF" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="300" y2="78"/>
    <line x1="0" y1="140" x2="300" y2="78"/>
    <line x1="0" y1="220" x2="300" y2="78"/>
    <line x1="600" y1="60" x2="300" y2="78"/>
    <line x1="600" y1="140" x2="300" y2="78"/>
    <line x1="600" y1="220" x2="300" y2="78"/>
  </g>

  <!-- floor grid: perspective lines + depth arcs converging toward the apex -->
  <g stroke="#FFD60A" stroke-opacity="0.28" stroke-width="1">
    <line x1="90" y1="300" x2="300" y2="78"/>
    <line x1="210" y1="300" x2="300" y2="78"/>
    <line x1="390" y1="300" x2="300" y2="78"/>
    <line x1="510" y1="300" x2="300" y2="78"/>
  </g>
  <g stroke="#FFD60A" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M 90 300 Q 300 250 510 300"/>
    <path d="M 40 300 Q 300 190 560 300"/>
  </g>

  <!-- glow at the apex -->
  <circle cx="300" cy="78" r="130" fill="url(#apexGlow)" filter="url(#soft)"/>

  <!-- neon seams along the wall/floor boundary -->
  <g stroke="#FFD60A" stroke-opacity="0.55" stroke-width="2" fill="none">
    <line x1="300" y1="78" x2="0" y2="300"/>
    <line x1="300" y1="78" x2="600" y2="300"/>
  </g>
  <line x1="300" y1="0" x2="300" y2="78" stroke="#B14EFF" stroke-opacity="0.5" stroke-width="2"/>

  <text x="300" y="286" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="4" fill="#9D89C9">MINI ROOM</text>

  <rect x="1" y="1" width="598" height="298" fill="none" stroke="#FFD60A" stroke-opacity="0.2" stroke-width="2"/>
</svg>
