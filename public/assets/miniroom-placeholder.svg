<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2F78"/>
      <stop offset="100%" stop-color="#3A2364"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2566"/>
      <stop offset="100%" stop-color="#2E1B4E"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241448"/>
      <stop offset="100%" stop-color="#160B2A"/>
    </linearGradient>
  </defs>

  <!-- room corner: two walls + floor meeting at one point (the apex) -->
  <polygon points="0,0 300,100 0,300" fill="url(#wallL)"/>
  <polygon points="600,0 300,100 600,300" fill="url(#wallR)"/>

  <!-- wall grid: two families of lines radiating from the apex, following each wall's own plane -->
  <g stroke="#B98CFF" stroke-opacity="0.28" stroke-width="1">
    <line x1="0" y1="0" x2="300" y2="100"/>
    <line x1="0" y1="40" x2="300" y2="100"/>
    <line x1="0" y1="90" x2="300" y2="100"/>
    <line x1="0" y1="150" x2="300" y2="100"/>
    <line x1="0" y1="220" x2="300" y2="100"/>
    <line x1="0" y1="300" x2="300" y2="100"/>

    <line x1="600" y1="0" x2="300" y2="100"/>
    <line x1="600" y1="40" x2="300" y2="100"/>
    <line x1="600" y1="90" x2="300" y2="100"/>
    <line x1="600" y1="150" x2="300" y2="100"/>
    <line x1="600" y1="220" x2="300" y2="100"/>
    <line x1="600" y1="300" x2="300" y2="100"/>
  </g>
  <g stroke="#B98CFF" stroke-opacity="0.28" stroke-width="1">
    <line x1="60" y1="0" x2="300" y2="100"/>
    <line x1="150" y1="0" x2="300" y2="100"/>
    <line x1="240" y1="0" x2="300" y2="100"/>
    <line x1="360" y1="0" x2="300" y2="100"/>
    <line x1="450" y1="0" x2="300" y2="100"/>
    <line x1="540" y1="0" x2="300" y2="100"/>
  </g>

  <!-- floor, drawn last so it cuts a clean edge across both walls -->
  <polygon points="300,100 0,300 600,300" fill="url(#floor)"/>

  <!-- floor grid: perspective columns converging on the apex, and rows parallel to the back wall -->
  <g stroke="#FFD60A" stroke-opacity="0.3" stroke-width="1">
    <line x1="60" y1="300" x2="300" y2="100"/>
    <line x1="150" y1="300" x2="300" y2="100"/>
    <line x1="240" y1="300" x2="300" y2="100"/>
    <line x1="360" y1="300" x2="300" y2="100"/>
    <line x1="450" y1="300" x2="300" y2="100"/>
    <line x1="540" y1="300" x2="300" y2="100"/>

    <line x1="210" y1="160" x2="390" y2="160"/>
    <line x1="150" y1="200" x2="450" y2="200"/>
    <line x1="90" y1="240" x2="510" y2="240"/>
    <line x1="30" y1="280" x2="570" y2="280"/>
  </g>

  <!-- wall/floor seam highlight -->
  <g stroke="#FFD60A" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="300" y1="100" x2="0" y2="300"/>
    <line x1="300" y1="100" x2="600" y2="300"/>
  </g>
</svg>
